name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: PYTHONPATH=custom_components/flame_king_scale python -m unittest discover -s tests
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
