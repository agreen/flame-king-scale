# Package-box overlay for:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Do not add a package_box: wrapper when using !include_dir_named.

input_number:
  package_box_empty_weight:
    name: Package box empty weight
    icon: mdi:package-variant-closed
    min: 0
    max: 300
    step: 0.01
    mode: box
    unit_of_measurement: lb

  package_box_detection_threshold:
    name: Package box detection threshold
    icon: mdi:weight-pound
    min: 0.1
    max: 50
    step: 0.1
    initial: 1
    mode: box
    unit_of_measurement: lb

  package_box_clear_hysteresis:
    name: Package box clear hysteresis
    icon: mdi:approximately-equal
    min: 0
    max: 10
    step: 0.05
    initial: 0.25
    mode: box
    unit_of_measurement: lb

input_text:
  package_box_scale_weight_sensor:
    name: Package box scale weight sensor
    icon: mdi:scale
    initial: sensor.back_yard_gas_monitor_2_gross_weight
    max: 255

  package_box_scale_request_button:
    name: Package box scale request button
    icon: mdi:bluetooth-connect
    initial: button.back_yard_gas_monitor_2_request_reading
    max: 255

template:
  - sensor:
      - name: Package box weight change
        unique_id: flame_king_package_box_weight_change
        icon: mdi:scale-balance
        device_class: weight
        state_class: measurement
        unit_of_measurement: lb
        availability: >-
          {% set source = states('input_text.package_box_scale_weight_sensor') %}
          {{ source | length > 0 and has_value(source) }}
        state: >-
          {% set source = states('input_text.package_box_scale_weight_sensor') %}
          {% set gross = states(source) | float(0) %}
          {% set empty = states('input_number.package_box_empty_weight') | float(0) %}
          {{ (gross - empty) | round(2) }}
        attributes:
          source_entity: >-
            {{ states('input_text.package_box_scale_weight_sensor') }}
          gross_weight_lb: >-
            {% set source = states('input_text.package_box_scale_weight_sensor') %}
            {{ states(source) | float(0) | round(2) }}
          empty_weight_lb: >-
            {{ states('input_number.package_box_empty_weight') | float(0) | round(2) }}

      - name: Package box package weight
        unique_id: flame_king_package_box_package_weight
        icon: mdi:package-variant
        device_class: weight
        state_class: measurement
        unit_of_measurement: lb
        availability: "{{ has_value('sensor.package_box_weight_change') }}"
        state: >-
          {% set change = states('sensor.package_box_weight_change') | float(0) %}
          {{ [change, 0] | max | round(2) }}

  - binary_sensor:
      - name: Package box package present
        unique_id: flame_king_package_box_package_present
        icon: >-
          {{ 'mdi:package-variant-closed-check' if this.state == 'on'
             else 'mdi:package-variant-closed' }}
        availability: "{{ has_value('sensor.package_box_package_weight') }}"
        state: >-
          {% set weight = states('sensor.package_box_package_weight') | float(0) %}
          {% set threshold = states('input_number.package_box_detection_threshold') | float(1) %}
          {% set hysteresis = states('input_number.package_box_clear_hysteresis') | float(0.25) %}
          {% if this.state == 'on' %}
            {{ weight > [threshold - hysteresis, 0] | max }}
          {% else %}
            {{ weight >= threshold }}
          {% endif %}
        attributes:
          package_weight_lb: >-
            {{ states('sensor.package_box_package_weight') | float(0) | round(2) }}
          detection_threshold_lb: >-
            {{ states('input_number.package_box_detection_threshold') | float(1) | round(2) }}

script:
  package_box_capture_empty_baseline:
    alias: "Package box: Capture empty baseline"
    icon: mdi:scale-off
    mode: single
    sequence:
      - variables:
          source: "{{ states('input_text.package_box_scale_weight_sensor') }}"
      - condition: template
        value_template: "{{ source | length > 0 and has_value(source) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.package_box_empty_weight
        data:
          value: "{{ states(source) | float(0) }}"

  package_box_check_10_seconds_after_close:
    alias: "Package box: Check 10 seconds after close"
    icon: mdi:package-down
    mode: restart
    sequence:
      - delay: "00:00:10"
      - variables:
          request_button: "{{ states('input_text.package_box_scale_request_button') }}"
      - condition: template
        value_template: >-
          {{ request_button | length > 0 and
             states(request_button) not in ['unknown', 'unavailable'] }}
      - action: button.press
        target:
          entity_id: "{{ request_button }}"

automation:
  - id: flame_king_package_box_read_after_close
    alias: "Package box: Read scale after close"
    description: Request one settled scale reading 10 seconds after the box closes.
    mode: restart
    triggers:
      - id: event_bus
        trigger: event
        event_type: package_box_closed
      - id: event_entity
        trigger: state
        entity_id: event.package_box_closed
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.id == 'event_bus' or
             (trigger.from_state is not none and
              trigger.from_state.state not in ['unknown', 'unavailable']) }}
    actions:
      - action: script.package_box_check_10_seconds_after_close

  - id: flame_king_package_box_detected_event
    alias: "Package box: Announce package detected"
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id: binary_sensor.package_box_package_present
        from: "off"
        to: "on"
    actions:
      - event: flame_king_package_detected
        event_data:
          package_weight_lb: >-
            {{ states('sensor.package_box_package_weight') | float(0) | round(2) }}
          gross_weight_lb: >-
            {% set source = states('input_text.package_box_scale_weight_sensor') %}
            {{ states(source) | float(0) | round(2) }}

  - id: flame_king_package_box_removed_event
    alias: "Package box: Announce package removed"
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id: binary_sensor.package_box_package_present
        from: "on"
        to: "off"
    actions:
      - event: flame_king_package_removed
        event_data:
          package_weight_lb: >-
            {{ states('sensor.package_box_package_weight') | float(0) | round(2) }}
          gross_weight_lb: >-
            {% set source = states('input_text.package_box_scale_weight_sensor') %}
            {{ states(source) | float(0) | round(2) }}

